[project]
name = "agent-loop"
version = "0.1.0"
description = "Autonomous AI Agent built from first principles"
requires-python = ">=3.12"

dependencies = [
    "fastapi",
    "uvicorn",
    "openai",
    "anthropic",
    "httpx",
    "beautifulsoup4",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "rich"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio"
]